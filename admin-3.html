<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>DukeBet Admin</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#07111f;color:#fff}
button,input,select{font:inherit}.app{max-width:900px;margin:auto;padding:18px}
.header,.card{background:#0c1b2d;border:1px solid #182d45;border-radius:16px;padding:16px;margin-bottom:14px}
h1{margin:0;font-size:22px}h2{font-size:16px;margin:0 0 12px}.sub,.small,label,.meta,.league{color:#8297ad;font-size:11px}
.sub{margin-top:5px}label{display:block;margin:9px 0 5px}input,select{width:100%;background:#091827;border:1px solid #29445f;color:#fff;border-radius:9px;padding:11px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}@media(max-width:650px){.grid{grid-template-columns:1fr}}
.btn{border:0;border-radius:9px;padding:10px 13px;cursor:pointer;font-weight:700;margin-top:8px}
.primary{background:#fff;color:#07111f}.secondary{background:#16304a;color:#fff}.danger{background:#3b1820;color:#ffb6c0}.green{background:#173b2b;color:#9ef0c0}.gray{background:#273342;color:#d2d8df}
.row{display:flex;gap:7px;flex-wrap:wrap}.top{display:flex;justify-content:space-between;gap:10px}
.fixture{background:#091827;border:1px solid #1b334d;border-radius:14px;padding:14px;margin-top:10px}
.teams{font-weight:800;font-size:15px;margin-top:5px}.badge{font-size:10px;text-transform:uppercase;border-radius:20px;padding:5px 8px}
.open{background:#153c2a;color:#9ef0c0}.suspended{background:#3a3217;color:#f0d58a}.finished{background:#29323d;color:#c5cbd3}
.actions{border-top:1px solid #1b334d;margin-top:12px;padding-top:10px}.message{display:none;padding:11px;border-radius:10px;margin-bottom:12px;font-size:12px}
</style>
</head>
<body>
<div class="app">
<header class="header"><h1>🏆 DukeBet Admin</h1><div class="sub">Fixture management and result control</div></header>
<div id="message" class="message"></div>

<section class="card">
<h2>🔐 Admin Access</h2><label>Admin Key</label>
<input id="adminKey" type="password" placeholder="Enter your admin key">
<button class="btn primary" onclick="unlock()">Unlock Panel</button>
</section>

<div id="panel" style="display:none">
<section class="card">
<h2>➕ Add Fixture</h2>
<div class="grid">
<div><label>Fixture ID</label><input id="add_id" placeholder="LIV-ARS-001"></div>
<div><label>Sport</label><select id="add_sport"><option>football</option><option>basketball</option><option>tennis</option></select></div>
<div><label>League</label><input id="add_league" placeholder="Premier League"></div>
<div><label>Kickoff</label><input id="add_kickoff" type="datetime-local"></div>
<div><label>Home Team</label><input id="add_home" placeholder="Home team"></div>
<div><label>Away Team</label><input id="add_away" placeholder="Away team"></div>
<div><label>Home Odds</label><input id="add_home_odds" type="number" step="0.01"></div>
<div><label>Draw Odds</label><input id="add_draw_odds" type="number" step="0.01"></div>
<div><label>Away Odds</label><input id="add_away_odds" type="number" step="0.01"></div>
</div>
<button class="btn primary" onclick="addFixture()">ADD FIXTURE</button>
</section>

<section class="card">
<div class="top"><h2>📋 Fixtures</h2><button class="btn secondary" style="margin:0" onclick="loadFixtures()">↻ Refresh</button></div>
<div id="fixtures"><div class="small">Loading...</div></div>
</section>
</div>
</div>

<script>
let key="",fixtures=[];
const $=id=>document.getElementById(id);
function msg(t,e=false){let x=$("message");x.textContent=t;x.style.display="block";x.style.background=e?"#28151a":"#10243a";x.style.color=e?"#e9a9b4":"#b8c9da"}
function headers(){return{"Content-Type":"application/json","x-admin-key":key}}
async function api(url,opt={}){let r=await fetch(url,{...opt,headers:{...headers(),...(opt.headers||{})}});let d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||"Request failed.");return d}
function unlock(){
 key=$("adminKey").value.trim();
 if(!key){msg("Enter your admin key.",true);return;}
 $("panel").style.display="block";
 msg("Admin panel unlocked. Loading fixtures...");
 loadFixtures();
}
function val(id){return $(id).value.trim()}
async function addFixture(){
let b={id:val("add_id"),sport:val("add_sport"),league:val("add_league"),home_team:val("add_home"),away_team:val("add_away"),kickoff:val("add_kickoff").replace("T"," "),home_odds:Number(val("add_home_odds")),draw_odds:Number(val("add_draw_odds")),away_odds:Number(val("add_away_odds"))};
if(!b.id||!b.home_team||!b.away_team||!b.kickoff)return msg("Fill in ID, teams and kickoff.",true);
try{await api("/api/admin-fixtures",{method:"POST",body:JSON.stringify(b)});msg("Fixture added successfully.");loadFixtures()}catch(e){msg(e.message,true)}
}
async function loadFixtures(){try{let d=await api("/api/admin-fixtures-list");fixtures=d.fixtures||[];render()}catch(e){msg(e.message,true)}}
function esc(x){return String(x??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
function js(x){return String(x??"").replaceAll("\","\\").replaceAll("'","\'")}
function safe(x){return String(x).replace(/[^a-zA-Z0-9_-]/g,"_")}
function localTime(x){return String(x||"").replace(" ","T").slice(0,16)}
function render(){
let box=$("fixtures");if(!fixtures.length){box.innerHTML='<div class="small">No fixtures found.</div>';return}
box.innerHTML=fixtures.map(f=>{
let id=safe(f.id),s=String(f.status||"open").toLowerCase();
return `<div class="fixture"><div class="top"><div><div class="league">${esc(f.league||f.sport||"Sport")}</div><div class="teams">${esc(f.home_team)} <span style="color:#536a82">VS</span> ${esc(f.away_team)}</div><div class="meta">ID: ${esc(f.id)} · ${esc(f.kickoff)}</div></div><span class="badge ${s}">${esc(s)}</span></div>
<div class="grid" style="margin-top:10px">
<div><label>Home Odds</label><input id="h_${id}" value="${esc(f.home_odds)}" type="number" step="0.01"></div>
<div><label>Draw Odds</label><input id="d_${id}" value="${esc(f.draw_odds)}" type="number" step="0.01"></div>
<div><label>Away Odds</label><input id="a_${id}" value="${esc(f.away_odds)}" type="number" step="0.01"></div>
<div><label>Kickoff</label><input id="k_${id}" value="${esc(localTime(f.kickoff))}" type="datetime-local"></div></div>
<div class="actions"><div class="row">
<button class="btn green" onclick="changeStatus('${js(f.id)}','open')">🟢 Open</button>
<button class="btn gray" onclick="changeStatus('${js(f.id)}','suspended')">⏸️ Suspended</button>
<button class="btn secondary" onclick="changeStatus('${js(f.id)}','finished')">⚫ Finished</button>
<button class="btn primary" onclick="edit('${js(f.id)}')">✏️ Save Edit</button>
<button class="btn danger" onclick="del('${js(f.id)}')">🗑️ Delete</button></div>
<div class="row"><span class="small" style="align-self:center">Result:</span>
<button class="btn secondary" onclick="result('${js(f.id)}','home')">Home Win</button>
<button class="btn secondary" onclick="result('${js(f.id)}','draw')">Draw</button>
<button class="btn secondary" onclick="result('${js(f.id)}','away')">Away Win</button></div>
${f.result?`<div class="meta" style="margin-top:6px">Recorded result: <b>${esc(f.result)}</b></div>`:""}</div></div>`
}).join("")
}
async function edit(id){
let f=fixtures.find(x=>String(x.id)===String(id)),q=safe(id);if(!f)return;
let b={id:f.id,sport:f.sport||"football",league:f.league||"",home_team:f.home_team,away_team:f.away_team,kickoff:($("k_"+q).value||"").replace("T"," "),status:f.status||"open",home_odds:Number($("h_"+q).value),draw_odds:Number($("d_"+q).value),away_odds:Number($("a_"+q).value)};
try{await api("/api/admin-fixture-update",{method:"POST",body:JSON.stringify(b)});msg("Fixture updated.");loadFixtures()}catch(e){msg(e.message,true)}
}
async function changeStatus(id,s){
let f=fixtures.find(x=>String(x.id)===String(id));if(!f)return;
let b={id:f.id,sport:f.sport||"football",league:f.league||"",home_team:f.home_team,away_team:f.away_team,kickoff:f.kickoff,status:s,home_odds:Number(f.home_odds),draw_odds:Number(f.draw_odds),away_odds:Number(f.away_odds)};
try{await api("/api/admin-fixture-update",{method:"POST",body:JSON.stringify(b)});msg("Status changed to "+s+".");loadFixtures()}catch(e){msg(e.message,true)}
}
async function result(id,r){
if(!confirm("Set result to "+r+" and finish this fixture?"))return;
try{await api("/api/result",{method:"POST",body:JSON.stringify({fixture_id:id,result:r})});msg("Result recorded.");loadFixtures()}catch(e){msg(e.message,true)}
}
async function del(id){
if(!confirm("Delete fixture "+id+"? This cannot be undone."))return;
try{await api("/api/admin-fixture-delete",{method:"POST",body:JSON.stringify({id})});msg("Fixture deleted.");loadFixtures()}catch(e){msg(e.message,true)}
}
</script>
</body>
</html>
